<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKYSPY FUEL</title><style>body{background:#101923;color:#eee;font:16px system-ui;max-width:700px;margin:5vh auto;padding:20px}h1{font-size:24px}table{width:100%;border-collapse:collapse}td,th{padding:13px 6px;border-bottom:1px solid #3e4b5c;text-align:right}td:first-child,th:first-child{text-align:left}.muted{color:#aab7c7;font-size:13px}.fail{color:#ffd28b}</style></head><body><h1>SKYSPY · PALIVA</h1><p class="muted">Kontakt Ohrazenice · RobinOil Turnov · Tank ONO Cvikov</p><table><thead><tr><th>Čerpací stanice</th><th>N95 Kč/l</th><th>Nafta Kč/l</th></tr></thead><tbody id="prices"><tr><td colspan="3">Načítání…</td></tr></tbody></table><p class="muted" id="date"></p><p class="muted">Čísla pocházejí z veřejně dostupných webů. U komunitních cen kontrolujte datum nahlášení. Nejde o garantované ceny na stojanu.</p><script>fetch('./prices.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const price=f=>f&&f.price!=null?`${Number(f.price).toFixed(2)}${f.status==='stale'?' ⚠':f.status==='unknown_date'?' *':''}`:'—';document.getElementById('prices').innerHTML=d.stations.map(s=>`<tr><td>${esc(s.name)}${s.error?'<br><small class="fail">Nedostupné</small>':''}</td><td>${price(s.natural95)}</td><td>${price(s.diesel)}</td></tr>`).join('');document.getElementById('date').textContent='Poslední kontrola: '+(d.generated_at?new Date(d.generated_at).toLocaleString('cs-CZ'):'dosud neproběhla')+' · * datum oficiální ceny není zveřejněno · ⚠ starší cena';}).catch(e=>{document.getElementById('prices').textContent='Zdroj cen je nedostupný';document.getElementById('date').textContent=e.message});</script></body></html>
